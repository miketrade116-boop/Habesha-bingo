      document.getElementById('statusBanner').innerText = ⏳ Round starts in: ${countdown}s (Card #${selectedCard} Chosen);

      if (countdown <= 0) {
        clearInterval(timerInterval);
        startActiveGame();
      }

    // Generate Standard B-I-N-G-O Ticket (1-75)
    function generateTicket(seed) {
      function getSubarray(start, count) {

        for (let i = start; i < start + 15; i++) nums.push(i);
        // Deterministic pseudo-random based on seed

      let matrix = [];
      for (let r = 0; r < 5; r++) {
        matrix.push([B[r], I[r], r === 2 ? 'FREE' : N[r], G[r], O[r]]);
      }
      return matrix;
    }

    // Natural Audio Speech Synthesizer
    function speakNumber(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);

      }

      // Switch UI from 1-100 to 5x5 board
      cardGrid.style.display = 'none';
      document.getElementById('statusBanner').innerText = Card #${selectedCard} Active - Listen & Mark your Card!;
      document.getElementById('bingoBoard').style.display = 'flex';

      playerMatrix = generateTicket(selectedCard);

      // Number Caller Engine (1-75)
      let pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
      let callIndex = 0;

      const caller = setInterval(() => {
        if (callIndex >= pool.length) {
          clearInterval(caller);
          return;
        }

        const num = pool[callIndex];
        calledNumbers.add(num);
        let prefix = 'B';
        if (num >= 16 && num <= 30) prefix = 'I';
        else if (num >= 31 && num <= 45) prefix = 'N';
        else if (num >= 46 && num <= 60) prefix = 'G';
        else if (num >= 61 && num <= 75) prefix = 'O';

        const callString = ${prefix} ${num};
        document.getElementById('callDisplay').innerText = callString;
        speakNumber(callString);

        callIndex++;
      }, 3500); // Speaks a new number every 3.5 seconds
    }

    function renderTicket(matrix) {
      const grid = document.getElementById('ticketGrid');
      grid.innerHTML = '';

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const val = matrix[r][c];
          const cell = document.createElement('div');
          cell.className = 'b-cell';

          if (val === 'FREE') {
            cell.classList.add('free', 'marked');
            cell.innerText = '★ FREE';
          } else {
            cell.innerText = val;
            cell.onclick = () => {
              if (calledNumbers.has(val)) {
                cell.classList.add('marked');
                markedCells.add(${r},${c});
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
              } else {
                alert(Number ${val} hasn't been called yet!);
              }
            };
          }
          grid.appendChild(cell);
        }
      }
    }

    function claimBingo() {
      let won = false;

      // Check rows
      for (let r = 0; r < 5; r++) {
        if ([0,1,2,3,4].every(c => markedCells.has(${r},${c}))) won = true;
      }
      // Check columns
      for (let c = 0; c < 5; c++) {
        if ([0,1,2,3,4].every(r => markedCells.has(${r},${c}))) won = true;
      }
      // Check diagonals
      if ([0,1,2,3,4].every(i => markedCells.has(${i},${i}))) won = true;
      if ([0,1,2,3,4].every(i => markedCells.has(${i},${4-i}))) won = true;

      if (won) {
        speakNumber("Bingo! Winner!");
        alert("🎉 BINGO! Congratulations, you won the round!");
      } else {
        alert("❌ Invalid Bingo! You do not have 5 in a row yet.");
      }
    }
