<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Addis Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #a288b9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      margin-bottom: 8px;
    }
    .nav-btn {
      background: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      color: #555;
    }
    .banner {
      background: #fef08a;
      color: #854d0e;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .status-bar {
      font-weight: bold;
      margin-bottom: 8px;
      color: #fff;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      width: 100%;
      max-width: 400px;
      background: #8b6fa3;
      padding: 6px;
      border-radius: 8px;
    }
    .tile {
      background: #e2d9eb;
      border-radius: 4px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
    .tile.selected {
      background: #f97316;
      color: #fff;
    }
    .tile.drawn {
      background: #22c55e !important;
      color: #fff !important;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }
    .btn-refresh { background: #3b82f6; }
    .btn-start { background: #e07a5f; }
    .fairness-box {
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 9px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="nav-btn">Wallet: 50 ETB</button>
    <button class="nav-btn">Stake: 10 ETB</button>
  </div>

  <div class="banner">
    ⚠️ Demo Mode: Pick your number and tap "Start Game" to test simulated draws!
  </div>

  <div class="status-bar" id="status">Select a Number</div>

  <div class="grid" id="grid"></div>

  <div class="btn-container">
    <button class="action-btn btn-refresh" onclick="resetBoard()">Refresh</button>
    <button class="action-btn btn-start" id="startBtn" onclick="startGame()">Start Game</button>
  </div>

  <div class="fairness-box">
    <strong>GAME HASH (FAIRNESS)</strong><br />
    <span id="gameHash">Generating SHA-256...</span>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const grid = document.getElementById('grid');
    const statusText = document.getElementById('status');
    let selectedNumber = null;
    let tiles = {};

    function initBoard() {
      grid.innerHTML = '';
      tiles = {};
      for (let i = 1; i <= 100; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerText = i;
        tile.onclick = () => selectNumber(i, tile);
        grid.appendChild(tile);
        tiles[i] = tile;
      }
      document.getElementById('gameHash').innerText = Array.from(crypto.getRandomValues(new Uint8Array(20))).map(b => b.toString(16).padStart(2, '0')).join('');
    }function selectNumber(num, el) {
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
      el.classList.add('selected');
      selectedNumber = num;
      statusText.innerText = Selected: ${num};
    }

    function resetBoard() {
      selectedNumber = null;
      statusText.innerText = "Select a Number";
      initBoard();
    }

    function startGame() {
      if (!selectedNumber) {
        alert("Please pick a number first!");
        return;
      }

      document.getElementById('startBtn').disabled = true;
      statusText.innerText = "Drawing numbers...";

      let numbers = Array.from({length: 100}, (_, i) => i + 1);
      numbers.sort(() => Math.random() - 0.5);

      let drawnCount = 0;
      const interval = setInterval(() => {
        if (drawnCount >= 35) {
          clearInterval(interval);
          document.getElementById('startBtn').disabled = false;
          statusText.innerText = "Round Finished! Better luck next time.";
          return;
        }

        const drawn = numbers[drawnCount];
        tiles[drawn].classList.add('drawn');

        if (drawn === selectedNumber) {
          clearInterval(interval);
          document.getElementById('startBtn').disabled = false;
          statusText.innerText = 🎉 BINGO! Number ${drawn} WON!;
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          alert(🎉 BINGO! You won!);
          return;
        }

        drawnCount++;
      }, 400);
    }

    initBoard();
  </script>
</body>
</html>
