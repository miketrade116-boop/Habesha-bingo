  <script>
    const tg = window.Telegram?.WebApp;

    let selectedCard = 74; // Highlighted default matching image
    let countdown = 15;

    let calledNumbers = new Set();
    let markedCells = new Set(["2,2"]); // FREE tile marked

    const mainGrid = document.getElementById('mainGrid');
    for (let i = 1; i <= 100; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile-100' + (i === 74 ? ' selected' : '');
      tile.innerText = i;
      tile.onclick = function() {
        document.querySelectorAll('.tile-100').forEach(t => t.classList.remove('selected'));

    // Auto Countdown Timer
    const lobbyTimer = setInterval(function() {

      countdown--;

        clearInterval(lobbyTimer);
        launchActiveGame();
      }
    }, 1000);

    function forceStartGame() {
      timerRunning = false;

    function resetBoard() {

    const amTeens = ["አስር", "አስራ አንድ", "አስራ ሁለት", "አስራ ሦስት", "አስራ አራት", "አስራ አምስት", "አስራ ስድስት", "አስራ ሰባት", "አስራ ስምንት", "አስራ ዘጠኝ"];

function getAmharicNumber(num) {
      if (num < 10) return amUnits[num];
      if (num >= 10 && num < 20) return amTeens[num - 10];
      const ten = Math.floor(num / 10);
      const unit = num % 10;
      return unit === 0 ? amTens[ten] : ${amTens[ten]} ${amUnits[unit]};
    }

    function getAmharicLetter(letter) {
      const map = { 'B': 'ቢ', 'I': 'አይ', 'N': 'ኤን', 'G': 'ጂ', 'O': 'ኦ' };
      return map[letter] || letter;
    }

    function speakAmharic(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 0.85;
        msg.pitch = 1.0;
        msg.lang = 'am-ET';
        window.speechSynthesis.speak(msg);
      }
    }

    // Generate Seeded 5x5 Matrix for Card
    function generateTicket(seed) {
      function seededRandom(s) {
        let x = Math.sin(s++) * 10000;
        return x - Math.floor(x);
      }

      function getColumn(min, max, offset) {
        let pool = [];
        for (let i = min; i <= max; i++) pool.push(i);
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(seededRandom(seed + offset + i) * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool.slice(0, 5);
      }

      const B = getColumn(1, 15, 10);
      const I = getColumn(16, 30, 20);
      const N = getColumn(31, 45, 30);
      const G = getColumn(46, 60, 40);
      const O = getColumn(61, 75, 50);

      let matrix = [];
      for (let r = 0; r < 5; r++) {
        matrix.push([B[r], I[r], r === 2 ? 'FREE' : N[r], G[r], O[r]]);
      }
      return matrix;
    }

    function launchActiveGame() {
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('bannerAlert').style.display = 'none';
      document.getElementById('bingoScreen').style.display = 'flex';

      const ticket = generateTicket(selectedCard || 74);
      const ticketGrid = document.getElementById('ticketGrid');
      ticketGrid.innerHTML = '';

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const val = ticket[r][c];
          const cell = document.createElement('div');
          cell.className = 't-cell';

          if (val === 'FREE') {
            cell.classList.add('free', 'marked');
            cell.innerText = '★ FREE';
          } else {
            cell.innerText = val;
            cell.onclick = function() {
              if (calledNumbers.has(val)) {
                cell.classList.add('marked');
                markedCells.add(${r},${c});
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
              } else {
                alert(ቁጥር ${val} ገና አልተጠራም!);
              }
            };
          }
          ticketGrid.appendChild(cell);
        }
      }

      // Voice Draw Loop (1-75)
      let pool = [];
      for (let i = 1; i <= 75; i++) pool.push(i);
      pool.sort(() => Math.random() - 0.5);

      let drawIdx = 0;
      const callInterval = setInterval(function() {
        if (drawIdx >= pool.length) {
          clearInterval(callInterval);
          return;
        }

        const num = pool[drawIdx];
        calledNumbers.add(num);

        let letter = 'B';
        if (num >= 16 && num <= 30) letter = 'I';
        else if (num >= 31 && num <= 45) letter = 'N';
        else if (num >= 46 && num <= 60) letter = 'G';
        else if (num >= 61 && num <= 75) letter = 'O';

        const amL = getAmharicLetter(letter);
        const amN = getAmharicNumber(num);

        document.getElementById('callEn').innerText = ${letter} ${num};
        document.getElementById('callAm').innerText = ${amL} - ${amN};
        speakAmharic(${amL} ${amN});

        drawIdx++;
      }, 3500);
    }
